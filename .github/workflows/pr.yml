name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: AxeForging/reusable-workflows/actions/pr-title-lint@291855e85ec985d1d318df82b8f9dce969b76933
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: ${{ github.event.pull_request.title }}

  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: AxeForging/reviewforge@main
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: gemini
          AI_MODEL: gemini-2.5-flash-lite
          AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOW_TOKEN_USAGE: true
          INCREMENTAL: false
          REVIEW_RULES: concise
          CUSTOM_RULES_FILE: .reviewforge-rules.txt
          CONTEXT_FILES: go.mod,README.md,.structlint.yaml,Makefile

  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build candidate
        run: go install ./cmd/seedstorm
      - uses: AxeForging/structlint/setup@v0.6.1
        with:
          version: v0.6.1
      - uses: AxeForging/dupehound/setup@v0.1.1
        with:
          version: v0.1.1
      - uses: AxeForging/gauntlet/setup@v0.1.1
        with:
          version: v0.1.1
      - name: Run quality gates
        run: gauntlet check --format github --since origin/${{ github.base_ref }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { postgres: "13-alpine", mysql: "5.7" }
          - { postgres: "13-alpine", mysql: "8.0" }
          - { postgres: "15-alpine", mysql: "8.0" }
          - { postgres: "17-alpine", mysql: "8.4" }
    name: integration (pg-${{ matrix.postgres }} / mysql-${{ matrix.mysql }})
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: seedstorm
          POSTGRES_PASSWORD: seedstorm
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: seedstorm
          MYSQL_PASSWORD: seedstorm
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: cd integration && go test -v -tags integration -count=1 ./... -timeout 300s
